---
# 中枢引擎配置 —— 统一走 LM Studio（端口 1234）
# 模型命名规范：LM Studio 格式 provider/model-name，不用 Ollama 的 model:tag
# 参考：AgentMemoryHub/experience/lmstudio-local-llm-migration.md

gateway_url: http://127.0.0.1:20128
default_model: auto/offline

# Embedding 后端：直连 LM Studio（不用 OmniRoute，因为 OmniRoute /v1/embeddings
# 要求 provider/model 格式，而 bge-m3 模型名不带前缀，直连 LM Studio 1234 用短格式可通）
embed:
  url: http://127.0.0.1:1234/v1/embeddings
  model: text-embedding-bge-small-zh-v1.5
  api_key: lm-studio
  timeout: 30
# 超时 60s：真实 dedup prompt(4.4k 字符)下 1.5b 实测 18.7s、9b 推理模型 38.3s，
# 原 30s 对 9b 必然超时→降级 conflicts（2026-09-02 根因诊断）
timeout: 60
compress: llmlingua

# ── 本地 LLM 优先链（2026-09-11 用户裁定）────────────────────────────
# 顺序：① LM Studio(1234) ② 本地次选端点（当前为空）③ OmniRoute(20128，即 gateway_url 最后兜底)
# 检索用 embedding 走 LM Studio 的 bge 系（见 embed 段；两个 bge 模型维度不同，不可混用同一向量库）
local_chat: # ① 本地首选：LM Studio
  url: http://127.0.0.1:1234/v1/chat/completions
  model: qwen/qwen3.5-9b
  max_tokens: 2048

# 2026-09-11 用户裁定：SGLang 不纳入 LLM 降级链（检索走 LM Studio 的 bge 系 embedding）
# 机制保留：如需追加次选端点，按 [{url, model(留空=调用前动态解析), max_tokens}] 形式补
local_chat_fallbacks: []

authority_dirs:
  - rules
  - methodology
  - blueprints
  - longterm
  - projects

dedup:
  min_confidence: 0.8
  require_human_for:
    - merge
    - delete
    - rule
