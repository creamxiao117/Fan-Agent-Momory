[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hub-engine"
version = "0.1.0"
description = "跨 Agent 平台统一记忆中枢 · 同步器与增强引擎"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.31",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=7.0"]

[tool.setuptools.packages.find]
include = ["common*", "tools*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# 覆盖率口径（审计 2026-09-25 · I-3：原本无任何覆盖率度量，28% 只是"测试行数"代理）
# 用法：`.venv\Scripts\python.exe -m pytest --cov=. --cov-report=term:skip-covered`
# 基线（2026-09-25 首测）：**生产代码 40.0%**（11568 语句 / 未覆盖 6933；含 tests/ 时为 55.1%，属虚高）
#   分区：tools/ 84.3% · common/ 90.8% · commands/ 62.9% · 顶层（engine/sync/mcp_server）64.3%
#         · **scripts/ 23.6%**（大量 CLI 包装，含 flywheel.py 597 语句 0%）
# 暂**不设 fail_under**（避免假红）；目标：tools/ ≥ 90%、scripts/ ≥ 40%。
[tool.coverage.run]
source = ["."]
omit = ["tests/*", "templates/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.ruff]
# 行宽与既有格式化口径一致（⚠️ 根目录 .ruff.toml **不覆盖** hub-engine/ 下的文件，
# 本文件才是本目录的配置入口；两者曾不一致：格式化按 120、lint 按默认 88 → 519 条假 E501）
line-length = 120
extend-exclude = ["templates/**"]

[tool.ruff.lint]
# 2026-09-25（审计 I-1）启用：原配置**只设 ignore、不设 select** ⇒ 实际只有 ruff 默认的
# E4/E7/E9/F，B（bugbear）/SIM/UP/C901 等真实缺陷类无护栏。现显式选族。
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "SIM", "C901"]
# BLE001/S110: 中枢全链路防御性 catch（resilience pattern，设计决策）
# PLW1510: subprocess.run 有外部 try/except 包装
# B018: 测试代码临时调试残留，但已在上游修复
# E402: 本仓脚本统一采用 `sys.path.insert(...)` 后再导入的加载模式（62 个脚本的入口约定），
#       改成包内相对导入会牵动全部入口 → 保留为**显式豁免**并在此写明理由
ignore = ['BLE001', 'S110', 'PLW1510', 'B018', 'E402']

# 原默认 10；取 15 是“先立基线”的折中（现存 16 处 >15 已按文件登记，见下）
[tool.ruff.lint.mccabe]
max-complexity = 15

# 脚手架模板豁免：templates/ 是供**拷贝后填写**的骨架，必然含占位导入/变量
# （如 `args = parser.parse_args()` 只写不读），对它们跑 F401/F841/UP009 必然误报。
# 注：本仓的 ruff 配置入口是**本文件**（linter.project_root = hub-engine），
#     根目录 .ruff.toml 不覆盖 hub-engine/ 下的文件——豁免写在那里不生效。
#
# ── E501/C901 基线（2026-09-25 启用规则族时登记，**每项都是待还的债，不是永久豁免**；
#    清空后请删掉对应行。当时总量：E501 81 处 / C901 16 处）──
[tool.ruff.lint.per-file-ignores]
"templates/*.py" = ["F401", "F841", "UP009"]
# E501（81）：内容型长行——卡片正文 / 内嵌 HTML 模板 / 测试夹具长字符串，重排会损可读性
"scripts/{reclassify,flywheel_runlog}.py" = ["E501"]
"tests/*" = ["E501"]
"scripts/{auto_process_sleep,auto_pytest_env_fix,check_encoding,flywheel,hub_daily_report,hub_health,hub_mcp_launcher,rule_following_timeseries,secret_sentry}.py" = ["E501"]
"commands/ingest.py" = ["E501"]
"mcp_server.py" = ["E501"]
"tools/inject.py" = ["E501"]
# C901（**已清零**）：复杂度债已于 2026-09-25 SPLIT2 全部拆完，无豁免。
# 已拆清单：run_patrol / auto_flywheel.run / sync.ingest / print_report / check_alerts /
#   _format_6panel_section / audit_index.audit / post_ingest_hook.main /
#   rule_following_timeseries.main / platform_bridge.push /
#   status.compute_snapshot_health_scores / status.print_snapshot_report /
#   auto_fix_lint.run_fix / flywheel._cmd_daily_report
# ⇒ 新增函数若超 15，请**直接拆**，不要再往这里加豁免。
"sync.py" = ["E501"]
