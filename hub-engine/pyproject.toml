[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hub-engine"
version = "0.1.0"
description = "跨 Agent 平台统一记忆中枢 · 同步器与增强引擎"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.31",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["common*", "tools*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
# BLE001/S110: 中枢全链路防御性 catch（resilience pattern，设计决策）
# PLW1510: subprocess.run 有外部 try/except 包装
# B018: 测试代码临时调试残留，但已在上游修复
ignore = ['BLE001', 'S110', 'PLW1510', 'B018']
