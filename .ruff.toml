# 归档设计文档/运行产物/虚拟环境/第三方依赖不在 ruff 检查与格式化范围内
# `_retired/`：已退役代码的归档区（2026-10-01 新增）——归档件不再当门禁对象，
# 否则它们会以“被取代的旧规范”把 lint 门禁搞红（保真归档优于强行改造）。
extend-exclude = [
    "docs/**",
    "work/**",
    ".tools/**",
    "_t1_venv/**",
    "_t1_deps/**",
    "AgentMemoryHub/**",
    # 退役归档区（2026-10-01）：保真留档，不再当门禁对象。
    # 用**无路径分隔符**的写法——ruff/gitignore 语义下它匹配任意层级的同名目录
    # （带 `/` 的写法在与不同 cwd 组合时会漏匹配，实测踩到）。
    "_retired",
]

# 行宽放宽到 120：覆盖内嵌 HTML/CSS 模板字符串和 docstring
line-length = 120
